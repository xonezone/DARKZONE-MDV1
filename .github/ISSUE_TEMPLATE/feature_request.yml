name: 💡 Feature request
description: Suggest a new command or feature
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
  - type: textarea
    id: example
    attributes:
      label: Example
      description: What would the command look like in WhatsApp?
      placeholder: ".weatherweek London"
